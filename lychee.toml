# Link checking for the docs (https://lychee.cli.rs). Pull requests check internal links and
# anchors offline; a weekly workflow also checks external links.

include_fragments = "anchor-only"
no_progress = true

exclude = [
  # Example hosts used in the docs, not real sites.
  '^https://ops\.vault\.azure\.net',
  '^https://<vault',
  '^https://rpc\.example',
  # Etherscan, Socket, and the npm package and search pages answer 403 to requests from CI
  # runners (bot protection), so a 403 there says nothing about the link. Nothing else checks these
  # links automatically: open the Etherscan, Socket and npm search pages in a browser, and check a
  # linked package with `npm view <name>`.
  '^https://(sepolia\.)?etherscan\.io/',
  '^https://www\.npmjs\.com/(package/|search)',
  '^https://socket\.dev/',
  # tsx.is chains to Let's Encrypt's ISRG Root YE, which the Mozilla-based root store lychee uses
  # does not hold yet, so lychee reports an untrusted certificate. Clients that trust that root,
  # such as macOS, load the site. Remove this entry once a lychee run without it passes.
  '^https://tsx\.is/',
  # The 1.0.0 launch note links the live proof at the v1.0.0 tag, which does not exist until the
  # release. Remove this entry once the tag is pushed.
  '^https://github\.com/aelmanaa/hardhat-kms/blob/v1\.0\.0/',
]

# GitHub rate-limits anonymous checks.
accept = ["200", "206", "429"]
