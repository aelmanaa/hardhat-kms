packages:
  - packages/*

# Install scripts of dependencies do not run unless listed here. Neither is needed: esbuild's
# only checks its platform binary, lefthook's only runs `lefthook install`, which `prepare` does.
allowBuilds:
  esbuild: false
  lefthook: false

# Versions of the development tools, shared by every package (decision 0010).

catalog:
  "@arethetypeswrong/cli": "0.18.5"
  "@changesets/changelog-github": "1.0.1"
  "@changesets/cli": "3.0.3"
  "@types/node": "^22.18.0"
  "@types/semver": "7.8.0"
  "c8": "12.0.0"
  "eslint-plugin-jsdoc": "65.0.0"
  "fast-check": "^4.10.2"
  "hardhat": "3.18.0"
  "knip": "6.38.0"
  "lefthook": "2.1.15"
  "oxfmt": "0.71.0"
  "oxlint": "1.86.0"
  "oxlint-tsgolint": "7.0.2003"
  "publint": "0.3.24"
  "tsx": "4.23.15"
  "typescript": "7.0.2"
