packages:
  - packages/*
  - examples/*
  - tools/*

# The examples ask for hardhat-kms and @hardhat-kms/aws by version range, as a project that
# installs them from npm does. This links them to the workspace packages instead.
linkWorkspacePackages: true

# Install scripts of dependencies do not run unless listed here. None is needed: esbuild's
# only checks its platform binary, lefthook's only runs `lefthook install`, which `prepare` does.
# keccak, node-hid and usb come with @nomicfoundation/hardhat-ledger, which only the
# coexistence test loads. keccak and usb ship prebuilt binaries, and keccak falls back to
# JavaScript where none fits. node-hid 2.1.2 has none, so it is never built. protobufjs comes
# with @google-cloud/kms; its postinstall only prints a warning about version ranges.
allowBuilds:
  esbuild: false
  keccak: false
  lefthook: false
  node-hid: false
  protobufjs: false
  usb: false

# Versions of the development tools, shared by every package (decision 0010).

catalog:
  "@arethetypeswrong/cli": "0.18.5"
  "@changesets/changelog-github": "1.0.1"
  "@changesets/cli": "3.0.3"
  "@nomicfoundation/hardhat-ignition": "^3.1.8"
  "@nomicfoundation/hardhat-ignition-viem": "^3.1.6"
  "@nomicfoundation/hardhat-ledger": "^3.1.0"
  "@nomicfoundation/hardhat-toolbox-viem": "^5.0.7"
  "@nomicfoundation/hardhat-viem": "^3.0.9"
  "@resvg/resvg-js": "2.6.2"
  "@stryker-mutator/core": "10.0.0"
  "@stryker-mutator/tap-runner": "10.0.0"
  "@types/node": "^22.18.0"
  "c8": "12.0.0"
  "dompurify": "3.4.16"
  "eslint-plugin-jsdoc": "65.0.1"
  "fast-check": "^4.10.2"
  "hardhat": "3.18.0"
  "knip": "6.39.0"
  "lefthook": "2.1.15"
  "mermaid": "12.1.0"
  "oxc-parser": "0.152.0"
  "oxfmt": "0.71.0"
  "oxlint": "1.86.0"
  "oxlint-tsgolint": "7.0.2003"
  "publint": "0.3.24"
  "tsx": "4.23.15"
  "typedoc": "0.28.20"
  "typedoc-plugin-markdown": "4.13.1"
  "typescript": "7.0.2"
  "verdaccio": "6.10.5"
  "viem": "^2.57.1"
  "vitepress": "1.6.4"
  "vitepress-plugin-llms": "1.14.0"
  "vue": "3.5.43"
  "yaml": "2.9.1"

# TypeDoc does not run on TypeScript 7 yet (TypeStrong/typedoc#3098), so tools/api-docs gets
# TypeScript 6 under the name `typescript` (decision 0012). Nothing else may use this catalog.
catalogs:
  typescript6:
    typescript: "npm:@typescript/typescript6@6.0.2"

# Security overrides for exact pins in development-only dependencies. pnpm applies them inside
# this workspace only; they are not published, and no package in the production dependency tree
# of packages/* is affected. Remove each one when its upstream pin moves past the fix.
overrides:
  # 24 axios advisories, highest fix 1.20.0. @ledgerhq/hw-app-eth 7.9.0 (via
  # @nomicfoundation/hardhat-ledger, coexistence test only) pins axios 1.13.5 exactly.
  axios: 1.20.0
  # GHSA-q8mj-m7cp-5q26, GHSA-4mjr-xmp4-gh2g, GHSA-x5fp-wj9c-mxmx. typed-rest-client 2.3.x
  # (via @stryker-mutator/core, mutation testing only) pins qs 6.15.1 exactly.
  "typed-rest-client>qs": ^6.16.0
  # GHSA-vc2v-76pw-4v95. verdaccio 6.10.5 (local registry for the release tests) pins
  # compression 1.8.1 exactly.
  compression: ^1.8.2
  # GHSA-238p-pmpm-9mq7. mermaid 12.1.0 (docs site) asks for katex ^0.16.47; the fix is in 0.18.2.
  katex: ^0.18.2
  # GHSA-p8wg-vrv2-v86f, GHSA-8r5x-fm3f-whwj, GHSA-xw65-4hp5-5hc7. verdaccio 6.10.5 (local
  # registry for the release tests) pins @verdaccio/hooks 8.1.6, which pins handlebars 4.7.9
  # exactly.
  handlebars: ^4.7.10
