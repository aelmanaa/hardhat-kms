packages:
  - packages/*
  - examples/*

# The examples ask for hardhat-kms and hardhat-kms-aws by version range, as a project that
# installs them from npm does. This links them to the workspace packages instead.
linkWorkspacePackages: true

# Install scripts of dependencies do not run unless listed here. None is needed: esbuild's
# only checks its platform binary, lefthook's only runs `lefthook install`, which `prepare` does.
# keccak, node-hid and usb come with @nomicfoundation/hardhat-ledger, which only the
# coexistence test loads. keccak and usb ship prebuilt binaries, and keccak falls back to
# JavaScript where none fits. node-hid 2.1.2 has none, so it is never built.
allowBuilds:
  esbuild: false
  keccak: false
  lefthook: false
  node-hid: false
  usb: false

# Versions of the development tools, shared by every package (decision 0010).

catalog:
  "@arethetypeswrong/cli": "0.18.5"
  "@changesets/changelog-github": "1.0.1"
  "@changesets/cli": "3.0.3"
  "@nomicfoundation/hardhat-ignition": "^3.1.8"
  "@nomicfoundation/hardhat-ignition-viem": "^3.1.6"
  "@nomicfoundation/hardhat-ledger": "^3.1.0"
  "@types/node": "^22.18.0"
  "c8": "12.0.0"
  "eslint-plugin-jsdoc": "65.0.0"
  "fast-check": "^4.10.2"
  "hardhat": "3.18.0"
  "knip": "6.38.0"
  "lefthook": "2.1.15"
  "oxfmt": "0.71.0"
  "oxlint": "1.86.0"
  "oxlint-tsgolint": "7.0.2003"
  "publint": "0.3.24"
  "tsx": "4.23.15"
  "typescript": "7.0.2"
