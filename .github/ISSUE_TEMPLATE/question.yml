name: Question
description: Ask how to do something with the plugin, after checking the docs.
labels: ["question", "status:needs-triage"]
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What you are trying to do, what you tried, and which docs page you read.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: hardhat-kms, the provider package, Hardhat and Node.js.
