name: SDK floors

# Tests each provider package against the lowest cloud SDK version its range allows, and the
# library account (connection.kms.getAccount) against the lowest viem its peer range allows. The
# CI workflow tests the lockfile versions; once Dependabot moves the lockfile forward, only this
# workflow tests the floor. It runs when a provider package, a manifest, the lockfile, the pnpm
# settings or the script changes. It is not a required check: path-filtered checks would block
# merges that do not trigger them.
on:
  pull_request:
    paths:
      - "packages/hardhat-kms-*/**"
      - "packages/hardhat-kms/src/internal/viem/**"
      - "packages/hardhat-kms/test/unit/viem/**"
      - "packages/hardhat-kms/test/integration/get-account.test.ts"
      - "packages/*/package.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/test-sdk-floors.ts"
      - "scripts/temporary-install.ts"
      - ".github/workflows/sdk-floors.yml"
  push:
    branches: [main]
    paths:
      - "packages/hardhat-kms-*/**"
      - "packages/hardhat-kms/src/internal/viem/**"
      - "packages/hardhat-kms/test/unit/viem/**"
      - "packages/hardhat-kms/test/integration/get-account.test.ts"
      - "packages/*/package.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/test-sdk-floors.ts"
      - "scripts/temporary-install.ts"
      - ".github/workflows/sdk-floors.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-floors-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  floors:
    name: SDK floors
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run test:sdk-floors
