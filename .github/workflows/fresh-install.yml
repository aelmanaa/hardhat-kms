name: Fresh install

# Installs each provider package with the core into empty projects with npm and pnpm, with empty
# caches so the registry's current metadata decides every version, and fails when the production
# tree has a deprecated package that ALLOWED in scripts/check-deprecated-packages.ts does not list
# (scripts/check-fresh-install.ts). The lockfile check of pkg:check cannot see a version that npm
# deprecates after it was locked, or a range that resolves differently in a new project.
# It runs weekly, on pull requests that change a published manifest, the script or the allowlist,
# and on manual dispatch; a dispatch with a version checks that published version instead of the
# workspace. The release workflow's pack job runs the same check before publishing.
# It is not a required check: a deprecation on the registry would block pull requests that changed
# nothing, and path-filtered checks would block merges that do not trigger them.
on:
  pull_request:
    paths:
      - "packages/*/package.json"
      - "pnpm-workspace.yaml"
      - "scripts/check-fresh-install.ts"
      - "scripts/check-deprecated-packages.ts"
      - ".github/workflows/fresh-install.yml"
  schedule:
    # Every Monday at 05:43 UTC.
    - cron: "43 5 * * 1"
  workflow_dispatch:
    inputs:
      version:
        description: A published version to check from the registry, or empty for the workspace
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: fresh-install-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fresh-install:
    name: Fresh install (npm, pnpm)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # The workspace's own install may use the cache; the script gives each scratch install new,
      # empty caches.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # The script checks that the version is exact before it installs anything.
      - name: Fresh installs, checked for deprecated packages
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$VERSION" ]; then
            pnpm run test:fresh-install --summary "$GITHUB_STEP_SUMMARY" --from-registry "$VERSION"
          else
            pnpm run test:fresh-install --summary "$GITHUB_STEP_SUMMARY"
          fi
