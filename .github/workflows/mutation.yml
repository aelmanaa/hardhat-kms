name: Mutation testing

# Runs Stryker on the core's crypto/ and signer/ code against every core unit test
# (docs/contributor/testing.md, layer 8). Not a required check and no pull_request trigger: a full
# run takes far longer than the rest of CI.
#
# - Nightly: skipped before install when the core's src/ and test/, the Stryker config and the
#   lockfile are unchanged since the last finished run; otherwise an incremental run that re-tests
#   only the mutants in changed files and the mutants covered by changed tests.
# - Monthly, and on dispatch with `force`: a full run, which also catches what incremental mode
#   cannot see (dependency changes).
on:
  schedule:
    # To run weekly instead, change the nightly line to "17 3 * * 1". Caches unused for 7 days are
    # evicted, so a weekly run may find no incremental file and do a full run.
    - cron: "17 3 2-31 * *" # nightly at 03:17 UTC, except on the 1st
    - cron: "17 3 1 * *" # monthly full run, 03:17 UTC on the 1st
  workflow_dispatch:
    inputs:
      force:
        description: Run every mutant, ignoring the incremental file and the no-change skip
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mutation
  cancel-in-progress: false

jobs:
  mutation:
    name: Mutation testing (Linux)
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    env:
      FULL_RUN: ${{ github.event.schedule == '17 3 1 * *' || inputs.force == true }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The key names everything that can change a result. An exact hit means the last finished run
      # saw the same code, tests, config and lockfile.
      - name: Cache key
        id: key
        env:
          HASH: ${{ hashFiles('packages/hardhat-kms/src/**', 'packages/hardhat-kms/test/**', 'packages/hardhat-kms/stryker.config.json', 'pnpm-lock.yaml') }}
        run: echo "key=stryker-${RUNNER_OS}-${HASH}" >> "$GITHUB_OUTPUT"
      - name: Look for a run of the same code
        id: seen
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/hardhat-kms/reports/stryker-incremental.json
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - name: Skip, nothing changed
        if: steps.seen.outputs.cache-hit == 'true' && env.FULL_RUN != 'true'
        run: |
          echo "No change to the core's code, tests, Stryker config or lockfile since the last finished run; skipped." >> "$GITHUB_STEP_SUMMARY"
      - name: Set whether to run
        id: run
        if: steps.seen.outputs.cache-hit != 'true' || env.FULL_RUN == 'true'
        run: echo "go=true" >> "$GITHUB_OUTPUT"

      - if: steps.run.outputs.go == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.run.outputs.go == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - if: steps.run.outputs.go == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts
      # The newest incremental file from an earlier run. A full run does not need it.
      - name: Restore the incremental file
        if: steps.run.outputs.go == 'true' && env.FULL_RUN != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/hardhat-kms/reports/stryker-incremental.json
          key: ${{ steps.key.outputs.key }}
          restore-keys: stryker-${{ runner.os }}-
      - name: Stryker
        id: stryker
        if: steps.run.outputs.go == 'true'
        working-directory: packages/hardhat-kms
        shell: bash
        run: |
          set -o pipefail
          if [ "$FULL_RUN" = "true" ]; then mode=--force; else mode=--incremental; fi
          pnpm exec stryker run "$mode" --reporters clear-text,html,json 2>&1 | tee "$RUNNER_TEMP/stryker.log"
      # Stryker's clear-text table: per-file score, killed, timeout, survived, no coverage, errors.
      - name: Score table
        if: always() && steps.stryker.outcome != 'skipped'
        shell: bash
        run: |
          {
            echo "### Mutation score ($([ "$FULL_RUN" = "true" ] && echo full || echo incremental) run)"
            echo
            echo '```'
            sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/stryker.log" | awk '/^-+\|-+\|/ { on = 1 } on && /\|/ { print; next } on { exit }'
            echo '```'
            echo
            echo "Surviving mutants are listed in the job log and in the mutation-report artifact."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the report
        if: always() && steps.stryker.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report
          path: packages/hardhat-kms/reports/mutation/
          retention-days: 14
          if-no-files-found: ignore
      # Saved only when Stryker passed, so a run below the break threshold is tried again the next night.
      - name: Save the incremental file
        if: steps.stryker.outcome == 'success' && steps.seen.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/hardhat-kms/reports/stryker-incremental.json
          key: ${{ steps.key.outputs.key }}
