name: Mutation testing

# Runs Stryker on the core's crypto/ and signer/ code against every core unit test
# (docs/contributor/testing.md, layer 8). Not a required check and no pull_request trigger: a full
# run takes far longer than the rest of CI.
#
# - Nightly: skipped before install when the last run on the same inputs passed; otherwise an
#   incremental run that re-tests only the mutants in changed mutated files and the mutants covered
#   by changed tests.
# - Monthly, and on dispatch with `force`: a full run. Incremental mode does not see changes outside
#   the mutated and test files, such as dependency updates or unmutated source the mutated code
#   imports (errors.ts, error-catalog.ts, rpc/), so their effect shows only in a full run.
#
# Cache design. Cache entries cannot be overwritten, so every run that reaches Stryker saves its
# incremental file under a new key:
#   stryker-<os>-<hash of the inputs>-<run id>-<attempt>-<pass|fail>
# The inputs are the core's src/ and test/, the Stryker config, the lockfile and this file.
# - Skip: a lookup with the prefix stryker-<os>-<hash>- returns the newest entry for these inputs.
#   The run is skipped only when that entry ends in -pass. After a failed run (a score below
#   `break`, including a full run), the next night runs again and fails again until fixed.
# - Restore: the newest entry for these inputs, else the newest entry of any inputs. Incremental
#   results are valid whether that run passed or failed.
# - Save: whenever Stryker ran, full runs included, so a full run replaces stale incremental results.
#   Stryker writes the incremental file also when the score is below `break`.
on:
  schedule:
    # To run weekly instead, change the nightly line to "17 3 * * 1". Caches unused for 7 days are
    # evicted, so a weekly run may find no incremental file and do a full run.
    - cron: "17 3 2-31 * *" # nightly at 03:17 UTC, except on the 1st
    - cron: "17 3 1 * *" # monthly full run, 03:17 UTC on the 1st
  workflow_dispatch:
    inputs:
      force:
        description: Run every mutant, ignoring the incremental file and the no-change skip
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mutation
  cancel-in-progress: false

jobs:
  mutation:
    name: Mutation testing (Linux)
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    env:
      FULL_RUN: ${{ github.event.schedule == '17 3 1 * *' || inputs.force == true }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache key prefix
        id: key
        env:
          HASH: ${{ hashFiles('packages/hardhat-kms/src/**', 'packages/hardhat-kms/test/**', 'packages/hardhat-kms/stryker.config.json', 'pnpm-lock.yaml', '.github/workflows/mutation.yml') }}
        run: echo "prefix=stryker-${RUNNER_OS}-${HASH}-" >> "$GITHUB_OUTPUT"
      # The primary key never matches; restore-keys returns the newest entry for these inputs.
      - name: Look for the last run on the same inputs
        id: seen
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/hardhat-kms/reports/stryker-incremental.json
          key: ${{ steps.key.outputs.prefix }}lookup
          restore-keys: ${{ steps.key.outputs.prefix }}
          lookup-only: true
      - name: Decide whether to run
        id: run
        env:
          MATCHED: ${{ steps.seen.outputs.cache-matched-key }}
        run: |
          if [ "$FULL_RUN" != "true" ] && [ -n "$MATCHED" ] && [ "${MATCHED%-pass}" != "$MATCHED" ]; then
            echo "The last run on the same code, tests, Stryker config, lockfile and workflow passed; skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.run.outputs.go == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.run.outputs.go == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - if: steps.run.outputs.go == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts
      # The newest incremental file from an earlier run. A full run (--force) does not read it.
      - name: Restore the incremental file
        if: steps.run.outputs.go == 'true' && env.FULL_RUN != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/hardhat-kms/reports/stryker-incremental.json
          key: ${{ steps.key.outputs.prefix }}lookup
          restore-keys: |
            ${{ steps.key.outputs.prefix }}
            stryker-${{ runner.os }}-
      - name: Stryker
        id: stryker
        if: steps.run.outputs.go == 'true'
        working-directory: packages/hardhat-kms
        shell: bash
        run: |
          set -o pipefail
          if [ "$FULL_RUN" = "true" ]; then mode=--force; else mode=--incremental; fi
          # 2 workers on the 2-vCPU runner, set explicitly: timeouts count as caught, and more workers
          # than cores turn survivors into timeouts, so the score depends on the worker count.
          pnpm exec stryker run "$mode" --concurrency 2 --reporters clear-text,html,json 2>&1 | tee "$RUNNER_TEMP/stryker.log"
      # Stryker's clear-text table: per-file score, killed, timeout, survived, no coverage, errors.
      - name: Score table
        if: always() && steps.stryker.outcome != 'skipped'
        shell: bash
        run: |
          {
            echo "### Mutation score ($([ "$FULL_RUN" = "true" ] && echo full || echo incremental) run)"
            echo
            echo '```'
            sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/stryker.log" | awk '/^-+\|-+\|/ { on = 1 } on && /\|/ { print; next } on { exit }'
            echo '```'
            echo
            echo "Surviving mutants are listed in the job log and in the mutation-report artifact."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the report
        if: always() && steps.stryker.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report
          path: packages/hardhat-kms/reports/mutation/
          retention-days: 14
          if-no-files-found: ignore
      # Saved after every run that reached Stryker, under a new key that records pass or fail.
      - name: Name the saved entry
        id: save
        if: always() && (steps.stryker.outcome == 'success' || steps.stryker.outcome == 'failure')
        env:
          PREFIX: ${{ steps.key.outputs.prefix }}
          RESULT: ${{ steps.stryker.outcome == 'success' && 'pass' || 'fail' }}
        run: echo "key=${PREFIX}${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RESULT}" >> "$GITHUB_OUTPUT"
      - name: Save the incremental file
        if: always() && steps.save.outcome == 'success' && hashFiles('packages/hardhat-kms/reports/stryker-incremental.json') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/hardhat-kms/reports/stryker-incremental.json
          key: ${{ steps.save.outputs.key }}
