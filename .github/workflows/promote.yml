# Verifies a staged and approved version from npm, and moves `latest` to it. Dispatched by a
# maintainer; docs/contributor/releasing.md, Verify and promote, has the steps.
# - job verify, for both targets: the live rule (scripts/check-live-rule.ts), for
#   sepolia:<commit> the proof check (test/live/check-release-proof.ts: the commit is on main or
#   release/X.Y, its test/live/proof.json covers the three providers and tested the tag's commit),
#   then scripts/check-registry-release.ts (beta, or release-X.Y for a hotfix, is the version, the
#   four packages have it, it is not below latest, so latest never moves backwards, no
#   prerelease, four provenance attestations, gitHead is the tag's commit), the package checks,
#   the consumer typecheck on three TypeScript versions, the peer-install matrix and the examples
#   against LocalStack, all installing the version from npm (--from-registry).
# - target verify: publishes the draft GitHub Release with the prerelease flag on.
# - target latest: after a maintainer approves the npm-latest environment, `npm dist-tag add` for
#   the four packages over OIDC, then the GitHub Release becomes the latest release. Both jobs
#   share the concurrency group promote-latest with every version, so latest moves one version
#   at a time; verify stays per version.
# - job live, only when live-run is fork: after the owner approves the live-tests environment, the
#   live suite in fork mode against the four packages installed from npm at the version
#   (HARDHAT_KMS_LIVE_SOURCE=registry:<version>), signed in to the three clouds over OIDC as in
#   live-tests.yml. Either target then waits for it, and a failed live run stops the promotion. A
#   Sepolia run (live-run sepolia:<commit>) still runs before the dispatch, on the maintainer's
#   machine or in live-tests.yml; this workflow checks its proof.
# Either target comments on the merged Version Packages pull request with the result of each job
# and the live-run value. Dispatch it from main: the npm-latest environment accepts only that
# branch.
name: Promote

on:
  workflow_dispatch:
    inputs:
      version:
        description: The exact version, without the v (for example 1.2.0)
        type: string
        required: true
      target:
        description: verify checks the version from npm; latest also moves the latest dist-tag to it
        type: choice
        options: [verify, latest]
        default: verify
      live-run:
        description: "sepolia:<proof commit> (a Sepolia run at the tag commit), fork (this run runs fork mode against the npm packages) or none"
        type: string
        required: true

permissions: {}

concurrency:
  group: promote-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the version from npm
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read # checks out the scripts and fetches the tag
    outputs:
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      # Each input is matched as one whole string ([[ =~ ]], not grep, which matches line by line),
      # so nothing later, the pull request comment included, sees an unchecked value.
      - name: Check the inputs
        env:
          VERSION: ${{ inputs.version }}
          TARGET: ${{ inputs.target }}
          LIVE_RUN: ${{ inputs.live-run }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be an exact X.Y.Z without the v and without a prerelease part, for example 1.2.0"
            exit 1
          fi
          if [[ ! "$LIVE_RUN" =~ ^(sepolia:[0-9a-f]{7,40}|fork|none)$ ]]; then
            echo "::error::live-run must be sepolia:<commit> (the commit that added test/live/proof.json), fork or none"
            exit 1
          fi
          {
            echo "## Promote $VERSION, target $TARGET"
            echo
            echo "live-run: \`$LIVE_RUN\`"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
      # The whole history of every branch: the proof check reads test/live/proof.json at the
      # live-run commit and checks that the commit is on main or on release/X.Y.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fetch the release tag
        id: tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git fetch --force --no-tags origin "+refs/tags/v$VERSION:refs/tags/v$VERSION"
          echo "commit=$(git rev-parse "refs/tags/v$VERSION^{commit}")" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Live rule
        env:
          VERSION: ${{ inputs.version }}
          TARGET: ${{ inputs.target }}
          LIVE_RUN: ${{ inputs.live-run }}
        run: node scripts/check-live-rule.ts "$VERSION" "$TARGET" "$LIVE_RUN" --summary "$GITHUB_STEP_SUMMARY"
      # For sepolia:<commit>: the commit is on main or release/X.Y and is the last to change
      # test/live/proof.json, the proof covers AWS, Google Cloud and Azure on Sepolia with every
      # record as its case expects, and the commit the suite tested is the tag's.
      - name: Sepolia proof
        env:
          VERSION: ${{ inputs.version }}
          LIVE_RUN: ${{ inputs.live-run }}
        run: node test/live/check-release-proof.ts "$VERSION" "$LIVE_RUN" --summary "$GITHUB_STEP_SUMMARY"
      - name: Registry release checks
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -o pipefail
          {
            echo '```text'
            node scripts/check-registry-release.ts "$VERSION" 2>&1 | tee /dev/stderr
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Package checks from the registry
        env:
          VERSION: ${{ inputs.version }}
        run: pnpm run build && node scripts/check-packages.ts --from-registry "$VERSION"
      - name: Consumer typecheck from the registry
        env:
          VERSION: ${{ inputs.version }}
        run: |
          for typescript in 5.9.3 6.0.3 7.0.2; do
            node scripts/consumer-typecheck.ts --from-registry "$VERSION" "$typescript"
          done
      - name: Peer installs from the registry
        env:
          VERSION: ${{ inputs.version }}
        run: node scripts/test-peer-installs.ts --from-registry "$VERSION"
      # Starts LocalStack, pinned by digest, and runs copies of the examples that install the
      # version from npm.
      - name: Examples from the registry against LocalStack
        env:
          HARDHAT_KMS_EXAMPLES_VERSION: ${{ inputs.version }}
        run: pnpm run test:examples
      - name: Record that every registry check passed
        env:
          VERSION: ${{ inputs.version }}
        run: echo "Every registry check passed for $VERSION." >> "$GITHUB_STEP_SUMMARY"

  # Only when live-run is fork. The job runs in the live-tests environment, so it waits for the
  # owner's approval on every promote run that asks for it; the three clouds trust only a token
  # whose subject names that environment. Everything is installed, built and downloaded before the
  # first cloud login, the published packages included: the suite then installs them from npm's
  # cache with npm_config_offline, so no download and no install script runs with credentials.
  live:
    name: Live tests from npm (fork)
    needs: verify
    if: inputs.live-run == 'fork'
    runs-on: ubuntu-26.04
    environment: live-tests
    # Counts from the start of the job, after the approval.
    timeout-minutes: 30
    permissions:
      contents: read # checks out the suite
      id-token: write # the OIDC token that the three clouds exchange for short-lived credentials
    env:
      HARDHAT_KMS_LIVE_NETWORK: fork
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No dependency cache: a job that can mint an OIDC token restores nothing another run saved.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build
      - name: Install anvil
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.1 # the Foundry release of the local fork runs, as in live-tests.yml
          cache: false
      # Downloads solc 0.8.24 into Hardhat's compiler cache, where the suite's build finds it.
      - name: Build the fixture project
        run: |
          node --input-type=module <<'EOF'
          import path from "node:path";

          import { createHardhatRuntimeEnvironment } from "hardhat/hre";

          const root = path.resolve("test/live/fixture-project");
          const hre = await createHardhatRuntimeEnvironment({ solidity: "0.8.24" }, {}, root);
          await hre.tasks.getTask("build").run({ quiet: true });
          EOF
      # The same install the suite makes, once, so that npm's cache holds every package it needs.
      - name: Download the packages from npm
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'EOF'
          import { installRegistryProject, removeScratchProject } from "./test/live/helpers/packages.ts";

          const { directory, versions } = installRegistryProject(process.env.VERSION);
          removeScratchProject(directory);
          console.log(versions);
          EOF
      # The suite would skip a provider whose key is empty and still pass.
      - name: Check that the three keys are set
        env:
          HARDHAT_KMS_LIVE_AWS_KEY_ID: ${{ secrets.HARDHAT_KMS_LIVE_AWS_KEY_ID }}
          HARDHAT_KMS_LIVE_GCP_KEY: ${{ secrets.HARDHAT_KMS_LIVE_GCP_KEY }}
          HARDHAT_KMS_LIVE_AZURE_KEY_ID: ${{ secrets.HARDHAT_KMS_LIVE_AZURE_KEY_ID }}
        run: |
          missing=""
          for name in HARDHAT_KMS_LIVE_AWS_KEY_ID HARDHAT_KMS_LIVE_GCP_KEY HARDHAT_KMS_LIVE_AZURE_KEY_ID; do
            if [ -z "$(printenv "$name" | tr -d '[:space:]')" ]; then
              missing="${missing} ${name}"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::not set in the live-tests environment:${missing}; a live run needs all three keys"
            exit 1
          fi

      - name: Sign in to AWS
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.LIVE_AWS_ROLE_ARN }}
          aws-region: ${{ vars.LIVE_AWS_REGION }}
          audience: sts.amazonaws.com
          mask-aws-account-id: true
      - name: Sign in to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.LIVE_GCP_WORKLOAD_IDENTITY_PROVIDER }}
      - name: Sign in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.LIVE_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.LIVE_AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # The key identifiers reach this step and the key check only, never the job's env.
      - name: Live tests
        env:
          HARDHAT_KMS_LIVE_AWS_KEY_ID: ${{ secrets.HARDHAT_KMS_LIVE_AWS_KEY_ID }}
          HARDHAT_KMS_LIVE_GCP_KEY: ${{ secrets.HARDHAT_KMS_LIVE_GCP_KEY }}
          HARDHAT_KMS_LIVE_AZURE_KEY_ID: ${{ secrets.HARDHAT_KMS_LIVE_AZURE_KEY_ID }}
          HARDHAT_KMS_LIVE_SEPOLIA_RPC_URL: ${{ secrets.HARDHAT_KMS_LIVE_SEPOLIA_RPC_URL }}
          HARDHAT_KMS_LIVE_SOURCE: registry:${{ inputs.version }}
          npm_config_offline: "true"
        run: |
          pnpm run test:live
          echo "The fork-mode live suite passed against the npm packages at ${HARDHAT_KMS_LIVE_SOURCE#registry:}." >> "$GITHUB_STEP_SUMMARY"

  release-beta:
    name: Publish the GitHub Release as a prerelease
    needs: [verify, live]
    # The live job runs only when live-run is fork. A skipped live job lets this one run only when
    # no live run was asked for: with fork, only a passed live job does.
    if: >-
      ${{ !cancelled() && inputs.target == 'verify' && needs.verify.result == 'success'
      && (needs.live.result == 'success'
      || (inputs.live-run != 'fork' && needs.live.result == 'skipped')) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write # edits the release
    steps:
      - name: Publish the draft with the prerelease flag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ inputs.version }}
        run: |
          draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
          if [ "$draft" != true ]; then
            echo "Release $TAG is already published; left as it is." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
          echo "Published release $TAG as a prerelease." >> "$GITHUB_STEP_SUMMARY"

  latest:
    name: Move latest on npm
    needs: [verify, live]
    # The live job runs only when live-run is fork. A skipped live job lets this one run only when
    # no live run was asked for: with fork, only a passed live job does.
    if: >-
      ${{ !cancelled() && inputs.target == 'latest' && needs.verify.result == 'success'
      && (needs.live.result == 'success'
      || (inputs.live-run != 'fork' && needs.live.result == 'skipped')) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # One group for every version, shared with release-latest: two promotions never read and move
    # latest at once. A run waits here while another run's job holds the group.
    concurrency:
      group: promote-latest
      cancel-in-progress: false
    # A maintainer approves this environment; the dist-tag trusted-publisher configuration pins it.
    environment: npm-latest
    permissions:
      id-token: write # the OIDC token for npm dist-tag add
    steps:
      # No registry-url: setup-node would write an .npmrc that expects a token.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      # Node 24 ships npm 11.19, and OIDC dist-tags need 11.21.0. The same pinned npm as
      # release.yml, with no install scripts; raise the pin there and here together.
      - name: Install the pinned npm
        run: | # zizmor: ignore[adhoc-packages] npm itself, pinned to an exact version
          npm install --global --ignore-scripts npm@12.2.0
          npm --version
          node -e 'const [a, b] = process.argv[1].split(".").map(Number); if (a < 11 || (a === 11 && b < 21)) { console.error("npm " + process.argv[1] + " is below 11.21.0"); process.exit(1); }' "$(npm --version)"
      # The verify job checked the dist-tags, possibly hours before the approval, so the four
      # packages are checked again just before the move: beta, or release-X.Y for a hotfix staged
      # from the release branch of its line, is the version, and latest is not above it. All four
      # are checked before any tag moves, so one package's bad state leaves no package moved. A
      # package whose latest already is the version is skipped, so a re-run after the maintainer
      # moved the tags by hand only edits the release.
      - name: npm dist-tag add for the four packages
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$VERSION is not a stable X.Y.Z; latest never points at a prerelease"
            exit 1
          fi
          # The dist-tag a hotfix of line X.Y is staged under; `npm view name dist-tags.<tag>` would
          # read the dot in it as a path, so the dist-tags are read as JSON.
          line="release-${VERSION%.*}"
          # npm 11 prints the dist-tags object and npm 12 wraps it in a one-element array; this
          # prints the object, and refuses any other shape or npm's error. unwrapNpmView in
          # scripts/npm-view.ts has the same rule; change the two together.
          unwrap='const what = "npm view " + process.argv[1] + " dist-tags --json printed "; let t = JSON.parse(process.argv[2]); if (Array.isArray(t)) { if (t.length !== 1) { console.error("::error::" + what + "an array of " + t.length + " entries; expected one object or a one-element array"); process.exit(1); } t = t[0]; } if (typeof t !== "object" || t === null || Array.isArray(t) || "error" in t) { console.error("::error::" + what + JSON.stringify(t) + ", not a dist-tags object"); process.exit(1); } console.log(JSON.stringify(t));'
          # Pass 1 reads and checks the four packages and moves nothing; pass 2 moves them.
          moves=()
          for name in hardhat-kms @hardhat-kms/aws @hardhat-kms/gcp @hardhat-kms/azure; do
            view="$(npm view "$name" dist-tags --json)"
            tags="$(node -e "$unwrap" "$name" "$view")"
            beta="$(node -p 'JSON.parse(process.argv[1]).beta ?? ""' "$tags")"
            hotfix="$(node -p 'JSON.parse(process.argv[1])[process.argv[2]] ?? ""' "$tags" "$line")"
            current="$(node -p 'JSON.parse(process.argv[1]).latest ?? ""' "$tags")"
            if [ "$beta" != "$VERSION" ] && [ "$hotfix" != "$VERSION" ]; then
              echo "::error::$name has beta at ${beta:-nothing} and $line at ${hotfix:-nothing}, not $VERSION; run release.yml for $VERSION first"
              exit 1
            fi
            if [ -n "$current" ] && ! node -e 'const [a, b] = process.argv.slice(1).map((v) => v.split(".").map(Number)); const d = a.map((n, i) => n - b[i]).find((n) => n !== 0) ?? 0; process.exit(d > 0 ? 1 : 0);' "$current" "$VERSION"; then
              echo "::error::$name has latest at $current, above $VERSION; latest never moves backwards"
              exit 1
            fi
            if [ "$current" = "$VERSION" ]; then
              echo "- $name: latest already is $VERSION" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            moves+=("$name" "${current:-nothing}")
          done
          for ((i = 0; i < ${#moves[@]}; i += 2)); do
            npm dist-tag add "${moves[i]}@$VERSION" latest
            echo "- ${moves[i]}: latest moved from ${moves[i + 1]} to $VERSION" >> "$GITHUB_STEP_SUMMARY"
          done

  release-latest:
    name: Mark the GitHub Release as latest
    needs: latest
    # A Sepolia proof or live-run none skips the optional live ancestor. Override its skip,
    # but edit the release only after npm latest succeeded and while this run is not cancelled.
    if: ${{ !cancelled() && needs.latest.result == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    # The group of the latest job. Another promotion's latest job can run between the two jobs of
    # this run, so the release becomes the latest only while npm's latest still is this version.
    concurrency:
      group: promote-latest
      cancel-in-progress: false
    permissions:
      contents: write # edits the release
    steps:
      - name: Publish the release as the latest, without the prerelease flag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ inputs.version }}
          VERSION: ${{ inputs.version }}
        run: |
          current="$(curl --fail --silent --show-error https://registry.npmjs.org/-/package/hardhat-kms/dist-tags | jq -r '.latest // ""')"
          if [ "$current" != "$VERSION" ]; then
            echo "::error::hardhat-kms has latest at ${current:-nothing}, not $VERSION; another promotion moved it, so release $TAG is left as it is"
            exit 1
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
          echo "Release $TAG is the latest release." >> "$GITHUB_STEP_SUMMARY"

  record:
    name: Comment on the Version Packages pull request
    needs: [verify, live, release-beta, latest, release-latest]
    if: ${{ !cancelled() && needs.verify.outputs.commit != '' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      pull-requests: write # comments on the merged pull request
    steps:
      - name: Comment with the result, the live-run value and the run link
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ needs.verify.outputs.commit }}
          VERSION: ${{ inputs.version }}
          TARGET: ${{ inputs.target }}
          LIVE_RUN: ${{ inputs.live-run }}
          VERIFY: ${{ needs.verify.result }}
          LIVE: ${{ inputs.live-run == 'fork' && needs.live.result || 'not run' }}
          DIST_TAG: ${{ inputs.target == 'latest' && needs.latest.result || 'not run' }}
          RELEASE: ${{ inputs.target == 'latest' && needs.release-latest.result || needs.release-beta.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          number="$(gh api "repos/$GITHUB_REPOSITORY/commits/$COMMIT/pulls" --jq '.[0].number // empty')"
          if [ -z "$number" ]; then
            echo "::warning::no pull request has $COMMIT as its merge commit; nothing to comment on"
            exit 0
          fi
          body="$(printf "Promote %s, target %s: verify %s, live fork run from npm %s, dist-tag move %s, GitHub Release %s.\n\nlive-run: \`%s\`\n\nRun: %s\n" \
            "$VERSION" "$TARGET" "$VERIFY" "$LIVE" "$DIST_TAG" "$RELEASE" "$LIVE_RUN" "$RUN_URL")"
          gh pr comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
