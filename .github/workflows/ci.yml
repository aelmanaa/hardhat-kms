name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint, format and typecheck
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run check

  docs:
    name: Docs
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Snippets typecheck, every page is indexed, generated pages are current
        run: pnpm run docs:check
      - name: Internal links and anchors
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --config lychee.toml README.md AGENTS.md CLAUDE.md CONTRIBUTING.md SECURITY.md packages/hardhat-kms/THIRD_PARTY_NOTICES.md .github/pull_request_template.md 'packages/*/README.md' 'examples/README.md' 'examples/*/README.md' 'docs/**/*.md'

  test:
    # Linux only. macOS and Windows run in ci-all-os.yml: nightly when main has a commit they have not
    # passed yet, on manual dispatch and on pull requests labelled ci:all-os. Job names give the OS
    # family, not the image, so an image change leaves the required check names alone.
    name: Test (Linux, Node ${{ matrix.node }})
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      # Developing needs Node >= 22.18 (root devEngines), but the published package supports 22.13;
      # this job checks that, so pnpm must not refuse the older runtime. To run the same locally, see
      # docs/contributor/testing.md#run-the-tests-on-the-published-floor.
      pnpm_config_runtime_on_fail: ${{ matrix.node == '22.13.0' && 'ignore' || 'error' }}
    strategy:
      fail-fast: false
      matrix:
        # Mirrors Hardhat's own matrix (NomicFoundation/hardhat .github/workflows/ci.yml,
        # node: [22.13.0, 24.0.0, 26.0.0]): the exact supported floors. Add or drop a leg when
        # Hardhat does; the policy is in README.md, Support. ci-all-os.yml adds macOS and Windows
        # on the lowest one.
        node: ["22.13.0", "24.0.0", "26.0.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Hardhat's solc cache (build lists, native and WASM builds) in its Linux, macOS and Windows
      # cache directories. With a warm cache, the tests make no request to binaries.soliditylang.org.
      # The key hashes the lockfile too, so a Hardhat upgrade saves a fresh cache.
      - name: Cache Solidity compilers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/hardhat-nodejs/compilers-v3
            ~/Library/Caches/hardhat-nodejs/compilers-v3
            ~/AppData/Local/hardhat-nodejs/Cache/compilers-v3
          key: solc-${{ runner.os }}-${{ hashFiles('packages/*/test/**/*.sol', 'pnpm-lock.yaml') }}
          restore-keys: solc-${{ runner.os }}-
      # Node 22.13.0 cannot strip TypeScript types natively; load tsx there only. On Node 26.0.0,
      # every Node process that inherits NODE_OPTIONS (pnpm, each test file, the fixture processes
      # the tests start, the CLI tests' Hardhat runs) preloads scripts/fail-on-deprecation.mjs: a
      # DeprecationWarning that scripts/deprecation-hook.ts does not allow fails the process.
      - name: Test
        shell: bash
        env:
          NODE_OPTIONS: ${{ matrix.node == '22.13.0' && '--import tsx' || matrix.node == '26.0.0' && format('--import {0}/scripts/fail-on-deprecation.mjs', github.workspace) || '' }}
        run: pnpm test

  localstack:
    name: LocalStack (AWS KMS)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Starts LocalStack, pinned by digest, on a random port; the runner's Docker pulls it.
      - run: pnpm run test:localstack

  examples:
    name: Examples (LocalStack)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Hardhat's solc cache. The key also hashes the examples' contracts, so a compiler they add
      # is saved; a cache saved by the test job is restored as a fallback.
      - name: Cache Solidity compilers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/hardhat-nodejs/compilers-v3
          key: solc-${{ runner.os }}-${{ hashFiles('packages/*/test/**/*.sol', 'examples/**/*.sol', 'pnpm-lock.yaml') }}
          restore-keys: solc-${{ runner.os }}-
      # Starts LocalStack, pinned by digest, on a random port, then builds, typechecks, lints and
      # runs every project in examples/ against it. The Ignition test also starts a Hardhat node on
      # port 8545.
      - run: pnpm run test:examples

  registry-mode:
    # The package checks in registry mode, against a local registry (verdaccio) that serves the
    # packages built from the checkout; docs/contributor/testing.md describes the mode.
    name: Registry mode (verdaccio)
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # The examples copies run `hardhat build`; the same cache as the examples job.
      - name: Cache Solidity compilers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/hardhat-nodejs/compilers-v3
          key: solc-${{ runner.os }}-${{ hashFiles('packages/*/test/**/*.sol', 'examples/**/*.sol', 'pnpm-lock.yaml') }}
          restore-keys: solc-${{ runner.os }}-
      # Builds and packs the four packages, publishes them to verdaccio on a free port, then runs
      # check-packages, consumer-typecheck, test-peer-installs (npm), check-registry-release and the
      # examples test with --from-registry against it. LocalStack and a Hardhat node on port 8545
      # run for the examples, as in the examples job.
      - run: pnpm run test:registry-mode

  coverage:
    name: Coverage
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Hardhat's solc cache (build lists, native and WASM builds) in its Linux, macOS and Windows
      # cache directories. With a warm cache, the tests make no request to binaries.soliditylang.org.
      # The key hashes the lockfile too, so a Hardhat upgrade saves a fresh cache.
      - name: Cache Solidity compilers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/hardhat-nodejs/compilers-v3
            ~/Library/Caches/hardhat-nodejs/compilers-v3
            ~/AppData/Local/hardhat-nodejs/Cache/compilers-v3
          key: solc-${{ runner.os }}-${{ hashFiles('packages/*/test/**/*.sol', 'pnpm-lock.yaml') }}
          restore-keys: solc-${{ runner.os }}-
      - run: pnpm run coverage

  package:
    name: Package checks
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run pkg:check

  consumer-types:
    name: Consumer typecheck (TypeScript ${{ matrix.typescript }})
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        typescript: ["5.9.3", "6.0.3", "7.0.2"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node scripts/consumer-typecheck.ts "${TYPESCRIPT_VERSION}"
        env:
          TYPESCRIPT_VERSION: ${{ matrix.typescript }}

  changeset:
    # A pull request that changes a published package carries a changeset, or an empty one when
    # there is nothing to tell users (CONTRIBUTING.md, Changesets). The release pull request
    # deletes every changeset and a Dependabot pull request carries none, so both skip the job; a
    # skipped required check passes. Push and merge-queue runs have no head branch, so they skip too.
    name: Changeset
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    if: >-
      github.event_name == 'pull_request' &&
      !startsWith(github.head_ref, 'changeset-release/') &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, so that origin/main and its merge base with the pull request exist.
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Exits 1 when a published package differs from the merge base with origin/main and no file
      # under .changeset/ was added since it. Private workspace packages (examples, tools) do not
      # count.
      - name: A changed package has a changeset
        run: |
          if ! pnpm changeset status --since origin/main; then
            echo "::error::This pull request changes a package without a changeset. Run 'pnpm changeset' to write one, or 'pnpm changeset add --empty' when there is nothing to tell users, then commit the file it adds under .changeset/. See ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/main/CONTRIBUTING.md#changesets"
            exit 1
          fi

  zizmor:
    name: Workflow security (zizmor)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
