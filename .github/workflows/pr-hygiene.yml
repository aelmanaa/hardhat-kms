name: PR hygiene

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  linked-issue:
    name: Links an issue
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    # Dependabot pull requests are tracked by their own labels. The release pull request, opened
    # by the version workflow from changeset-release/*, has a generated body with no issue link.
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      !startsWith(github.head_ref, 'changeset-release/')
    steps:
      - name: Require a closing keyword or issue reference
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if ! printf '%s' "$PR_BODY" | grep -Eiq '(close[sd]?|fix(e[sd])?|resolve[sd]?|refs?) +#[0-9]+'; then
            echo "::error::Link the issue this pull request addresses, for example 'Closes #12'."
            exit 1
          fi

  security-checklist:
    # A pull request that changes a path listed in docs/contributor/security-review.md carries the
    # ticked security checklist of the pull request template. The script, the list and the template
    # come from the base branch, so a pull request cannot loosen the rule it is checked against.
    name: Security checklist
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      !startsWith(github.head_ref, 'changeset-release/')
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Require the checklist when a listed path changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ ! -f scripts/security-checklist.ts ]; then
            echo "::notice::The base branch has no security checklist rule; nothing to check."
            exit 0
          fi
          gh api --paginate --slurp "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files" > "${RUNNER_TEMP}/files.json"
          printf '%s' "$PR_BODY" > "${RUNNER_TEMP}/body.md"
          node scripts/security-checklist.ts --files "${RUNNER_TEMP}/files.json" \
            --changed-files "$CHANGED_FILES" --body "${RUNNER_TEMP}/body.md" --summary "$GITHUB_STEP_SUMMARY"
