# Stages a prerelease of a future major to npm from a maintainer-signed vX.Y.Z-next.N tag on the
# next branch, under the next dist-tag only. The jobs are in release-stage.yml, the same ones
# release.yml runs: signed tag against .github/release-keys/, the CI gate, fresh installs, pack,
# the tarball sums, the npm-publish environment and a staged publish over OIDC. This file fixes
# the channel to next, so every step refuses a version without -next.N, and the tagged commit must
# be on the next branch, which the channel names and no input or tag can change
# (scripts/release-channel.ts). A next version never reaches beta or latest: promote.yml refuses
# it. docs/contributor/releasing.md, A future major, has the maintainer's steps.
# A manual dispatch is always a dry run (release-stage.yml has what it runs). GitHub dispatches
# only a workflow whose file is on the default branch.
name: Release next

on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*-next.[0-9]*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Run verify-tag, the CI report and pack, then npm stage publish --dry-run; nothing is published
        type: boolean
        default: true
      tag:
        description: An existing vX.Y.Z-next.N tag to dry-run, or none to pack the dispatched branch
        type: string
        default: none

permissions: {}

concurrency:
  group: >-
    ${{ github.event_name == 'push' && format('release-next-{0}', github.ref_name)
    || format('release-next-dry-run-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  release:
    name: Next
    # The union of what the called jobs need; each job there narrows it to its own permissions.
    permissions:
      contents: write # the jobs check out the repository; github-release creates the draft release
      actions: write # gate-ci reads the CI runs and dispatches the ones the commit lacks
      id-token: write # publish exchanges the OIDC token for the staged publish and provenance
    # A job-level call reads the called workflow from the commit this run is on, never from a
    # checkout, so ./ and the self-repository $/ resolve alike; actionlint 1.7.12 rejects $/.
    uses: ./.github/workflows/release-stage.yml # zizmor: ignore[self-repository]
    with:
      channel: next
      dispatch-tag: ${{ inputs.tag }}
      dispatch-dry-run: ${{ format('{0}', inputs.dry-run) }}
