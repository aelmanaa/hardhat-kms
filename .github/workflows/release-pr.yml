# Keeps the Version Packages pull request current. On every push to main, changesets/action runs
# `pnpm run version-packages` (changeset version, then the lockfile) on the branch
# changeset-release/main and opens or updates the pull request from it. It publishes nothing and
# creates no tag: a release starts only from a maintainer-signed tag (release.yml).
# The action pushes through the GitHub API with the default GITHUB_TOKEN, so the commit is signed
# by GitHub and no personal or App token exists. Two repository settings follow from that:
# - Settings, Actions, General, "Allow GitHub Actions to create and approve pull requests" must be
#   on, or the action cannot open the pull request.
# - A pull request created or updated by GITHUB_TOKEN starts its workflows in an approval-required
#   state. A maintainer starts them with "Approve workflows to run" on the pull request; until then
#   its required checks stay pending and it cannot merge.
# docs/contributor/releasing.md, Cut a release, has the steps.
name: Release pull request

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-pr
  cancel-in-progress: false

jobs:
  version-pr:
    name: Version Packages pull request
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write # pushes changeset-release/main through the API
      pull-requests: write # opens and updates the pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # changeset version reads the history of each changeset for the changelog links.
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No dependency cache: the job holds a write token, so it restores nothing another run saved.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      # No publish-script: with no changeset on main the action does nothing.
      - name: Open or update the Version Packages pull request
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        env:
          # @changesets/changelog-github reads the pull request and author of each changeset.
          GITHUB_TOKEN: ${{ github.token }}
        with:
          version-script: pnpm run version-packages
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
