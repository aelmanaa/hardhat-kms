# Stages a release to npm from a maintainer-signed vX.Y.Z tag. docs/contributor/releasing.md has the
# maintainer's steps and decision 0016 the reasons. The jobs, in order:
# 1. verify-tag: scripts/release-trigger.ts checks the trigger and its inputs as whole strings,
#    then scripts/verify-release-tag.ts checks the tag: signed by a key in .github/release-keys/,
#    the version of the four manifests, no prerelease part, its commit on main.
# 2. gate-ci: the tagged commit has a passing ci.yml run, a ci-all-os.yml run that passed on macOS
#    and Windows, and passing hardhat-versions.yml and sdk-floors.yml runs; for each of the last
#    three that has no passing run on the commit, the job dispatches it on the tag and waits
#    (scripts/release-gate-ci.ts).
# 3. pack: build, the package checks, the publish plan, then one tarball per package with `gitHead`
#    set to the tagged commit, checked by scripts/check-tarballs.ts. The SHA-256 sums leave the job
#    as a job output, apart from the artifact they cover.
# 4. publish: after a maintainer approves the npm-publish environment, the same check against that
#    output, then `npm stage publish` of the four tarballs under the beta dist-tag, with
#    provenance. Nothing is installable until a maintainer approves the stage on npmjs.com.
# 5. github-release: a draft GitHub Release with the prerelease flag, its notes from the
#    hardhat-kms changelog.
# A manual dispatch is always a dry run: verify-tag on the `tag` input (or, with `none`, the
# dispatched branch without the tag checks), gate-ci-report, which only reads, pack, then
# `npm stage publish --dry-run` of each tarball. It needs no environment, no OIDC token and no
# secret. GitHub dispatches only a workflow whose file is on the default branch.
name: Release

on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Run verify-tag, the CI report and pack, then npm stage publish --dry-run; nothing is published
        type: boolean
        default: true
      tag:
        description: An existing vX.Y.Z tag to dry-run, or none to pack the dispatched branch
        type: string
        default: none

permissions: {}

concurrency:
  group: >-
    ${{ github.event_name == 'push' && format('release-{0}', github.ref_name)
    || format('release-dry-run-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  verify-tag:
    name: Verify the tag
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read # checks out the scripts, the keys and the history
    outputs:
      tag: ${{ steps.trigger.outputs.tag }}
      dry-run: ${{ steps.trigger.outputs.dry-run }}
      commit: ${{ steps.verify.outputs.commit }}
      version: ${{ steps.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history: the script checks that the tagged commit is an ancestor of origin/main.
          fetch-depth: 0
          persist-credentials: false
      # Node 24 strips the scripts' types; they import only node: modules, so nothing is installed.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      # Writes the tag and the mode to GITHUB_OUTPUT only after checking each input as one whole
      # string, so a dispatch input with a newline cannot add or override an output.
      - name: Read the trigger
        id: trigger
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRY_RUN: ${{ inputs.dry-run }}
        run: >-
          node scripts/release-trigger.ts --event="$EVENT" --ref-name="$REF_NAME" --tag="$INPUT_TAG"
          --dry-run="$INPUT_DRY_RUN" --output="$GITHUB_OUTPUT"
      - name: Verify the tag signature, version and commit
        id: verify
        env:
          TAG: ${{ steps.trigger.outputs.tag }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$TAG" = none ]; then
            version="$(node -p 'require("./packages/hardhat-kms/package.json").version')"
            echo "commit=$HEAD_SHA" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "Dry run without a tag: the signature, tag-name and main checks did not run. Packing \`$HEAD_SHA\` at version $version." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Fetch the tag object itself, and main, so neither depends on how the checkout fetched them.
          git fetch --force --no-tags origin "+refs/tags/$TAG:refs/tags/$TAG" "+refs/heads/main:refs/remotes/origin/main"
          set -o pipefail
          node scripts/verify-release-tag.ts "$TAG" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "commit=$(git rev-parse "refs/tags/$TAG^{commit}")" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  gate-ci:
    name: Require CI on the tagged commit
    needs: verify-tag
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    # The gate waits up to 90 minutes in all, queueing included; the macOS and Windows run is the longest.
    timeout-minutes: 100
    permissions:
      contents: read # checks out the scripts
      actions: write # reads the runs of the four workflows, and dispatches all but ci.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/release-gate-ci.ts
            scripts/ci-all-os-decide.ts
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Require passing runs of the four CI workflows, dispatching any that has none
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ needs.verify-tag.outputs.commit }}
          TAG: ${{ needs.verify-tag.outputs.tag }}
        run: >-
          node scripts/release-gate-ci.ts --repo "$GITHUB_REPOSITORY" --sha "$COMMIT" --ref "$TAG"
          --mode enforce --wait-minutes 90 --summary "$GITHUB_STEP_SUMMARY"

  # The dry run's gate: reads the runs once and reports, with read access only.
  gate-ci-report:
    name: Report CI on the commit (dry run)
    needs: verify-tag
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read # checks out the scripts
      actions: read # reads the runs of ci.yml, ci-all-os.yml, hardhat-versions.yml and sdk-floors.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/release-gate-ci.ts
            scripts/ci-all-os-decide.ts
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Report the ci.yml, ci-all-os.yml, hardhat-versions.yml and sdk-floors.yml runs
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ needs.verify-tag.outputs.commit }}
          TAG: ${{ needs.verify-tag.outputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          ref="$TAG"
          if [ "$ref" = none ]; then ref="$REF_NAME"; fi
          node scripts/release-gate-ci.ts --repo "$GITHUB_REPOSITORY" --sha "$COMMIT" --ref "$ref" \
            --mode report --summary "$GITHUB_STEP_SUMMARY"

  pack:
    name: Build and pack
    needs: verify-tag
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read # checks out the tagged commit
    outputs:
      sums: ${{ steps.pack.outputs.sums }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-tag.outputs.commit }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No dependency cache: what goes to npm is built only from the lockfile and the registry.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      # Builds, then publint, arethetypeswrong, the deprecated-package check and knip.
      - name: Build and check the packages
        run: pnpm run pkg:check
      - name: Publish plan
        run: |
          {
            echo "## Publish plan"
            echo
            echo "The plan prints changesets' default dist-tag; the publish job stages under \`beta\`."
            echo
            echo '```text'
            pnpm exec changeset publish-plan 2>&1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # npm writes no gitHead into a manifest published from a tarball, and the promotion checks
      # tie the published version to the tag through it. pnpm pack keeps the field.
      - name: Pack the four packages with gitHead set to the tagged commit
        id: pack
        env:
          COMMIT: ${{ needs.verify-tag.outputs.commit }}
          VERSION: ${{ needs.verify-tag.outputs.version }}
        run: |
          out="$RUNNER_TEMP/tarballs"
          sums="$RUNNER_TEMP/SHA256SUMS"
          mkdir -p "$out"
          : > "$sums"
          # The core first: the providers pin it to the exact version.
          for dir in hardhat-kms hardhat-kms-aws hardhat-kms-gcp hardhat-kms-azure; do
            (cd "packages/$dir" && npm pkg set "gitHead=$COMMIT")
            tarball="$(cd "packages/$dir" && pnpm pack --json --pack-destination "$out" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).filename')"
            (cd "$out" && sha256sum "$(basename "$tarball")") >> "$sums"
          done
          node scripts/check-tarballs.ts --dir "$out" --sums "$sums" --version "$VERSION" --commit "$COMMIT"
          echo "sums=$(base64 -w0 < "$sums")" >> "$GITHUB_OUTPUT"
      - name: Tarball sums, file lists and the diff against latest
        run: |
          out="$RUNNER_TEMP/tarballs"
          {
            echo "## Tarballs"
            echo
            echo "| Tarball | SHA-256 |"
            echo "| --- | --- |"
            while read -r sum file; do echo "| \`$file\` | \`$sum\` |"; done < "$RUNNER_TEMP/SHA256SUMS"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          while read -r _ file; do
            name="$(tar -xOzf "$out/$file" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).name')"
            tar -tzf "$out/$file" | sort > "$RUNNER_TEMP/$file.files"
            {
              echo "<details><summary>$name: $(wc -l < "$RUNNER_TEMP/$file.files") files</summary>"
              echo
              echo '```text'
              cat "$RUNNER_TEMP/$file.files"
              echo '```'
              echo
              echo "</details>"
              echo
            } >> "$GITHUB_STEP_SUMMARY"
            url="$(npm view "$name@latest" dist.tarball 2>/dev/null || true)"
            if [ -z "$url" ]; then
              echo "$name has no latest version on npm yet; no file-list diff." >> "$GITHUB_STEP_SUMMARY"
            else
              curl -fsSL "$url" -o "$RUNNER_TEMP/latest.tgz"
              tar -tzf "$RUNNER_TEMP/latest.tgz" | sort > "$RUNNER_TEMP/latest.files"
              {
                echo "<details><summary>$name: file list against latest</summary>"
                echo
                echo '```diff'
                diff -u "$RUNNER_TEMP/latest.files" "$RUNNER_TEMP/$file.files" || true
                echo '```'
                echo
                echo "</details>"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            echo >> "$GITHUB_STEP_SUMMARY"
          done < "$RUNNER_TEMP/SHA256SUMS"
      - name: Release notes from the hardhat-kms changelog
        env:
          VERSION: ${{ needs.verify-tag.outputs.version }}
          DRY_RUN: ${{ needs.verify-tag.outputs.dry-run }}
        run: |
          notes="$RUNNER_TEMP/release-notes/notes.md"
          mkdir -p "$(dirname "$notes")"
          if [ -f packages/hardhat-kms/CHANGELOG.md ]; then
            awk -v heading="## $VERSION" '$0 == heading { found = 1; next } found && /^## / { exit } found { print }' \
              packages/hardhat-kms/CHANGELOG.md > "$notes"
          fi
          if [ ! -s "$notes" ]; then
            if [ "$DRY_RUN" = true ]; then
              echo "::warning::packages/hardhat-kms/CHANGELOG.md has no '## $VERSION' entry; a release run would fail here. A release tag goes on the merge commit of the Version Packages pull request, which writes the entry."
              echo "No changelog entry for $VERSION." > "$notes"
            else
              echo "::error::packages/hardhat-kms/CHANGELOG.md has no '## $VERSION' entry at the tagged commit. Tag the merge commit of the Version Packages pull request, which writes the entry."
              exit 1
            fi
          fi
          { echo "## Release notes"; echo; cat "$notes"; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tarballs
          path: ${{ runner.temp }}/tarballs/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Stage to npm under beta
    needs: [verify-tag, gate-ci, pack]
    if: github.event_name == 'push' && needs.verify-tag.outputs.dry-run == 'false'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # A maintainer approves this environment; each trusted-publisher configuration on npm pins it.
    environment: npm-publish
    permissions:
      contents: read # checks out the tarball check at the tagged commit
      id-token: write # the OIDC token for trusted publishing and for the provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-tag.outputs.commit }}
          persist-credentials: false
          sparse-checkout: |
            scripts/check-tarballs.ts
            scripts/registry.ts
            scripts/temporary-install.ts
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tarballs
          path: ${{ runner.temp }}/tarballs
      # No registry-url: setup-node would write an .npmrc that expects a token.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      # The sums come from the pack job's output, not from the artifact. The check also refuses a
      # version that is not a stable X.Y.Z, so a prerelease never reaches the registry from here.
      - name: Check the tarballs against the pack job's sums, version and commit
        env:
          SUMS: ${{ needs.pack.outputs.sums }}
          VERSION: ${{ needs.verify-tag.outputs.version }}
          COMMIT: ${{ needs.verify-tag.outputs.commit }}
        run: |
          printf '%s' "$SUMS" | base64 -d > "$RUNNER_TEMP/SHA256SUMS"
          node scripts/check-tarballs.ts --dir "$RUNNER_TEMP/tarballs" --sums "$RUNNER_TEMP/SHA256SUMS" \
            --version "$VERSION" --commit "$COMMIT"
      # Node 24 ships npm 11.19. Staged publishing needs 11.15.0 and OIDC dist-tags 11.21.0, so the
      # release and promote jobs install the same pinned npm, with no install scripts, and refuse
      # one below 11.21.0. Raise the pin on purpose, in all four places.
      - name: Install the pinned npm
        run: | # zizmor: ignore[adhoc-packages] npm itself, pinned to an exact version
          npm install --global --ignore-scripts npm@12.2.0
          npm --version
          node -e 'const [a, b] = process.argv[1].split(".").map(Number); if (a < 11 || (a === 11 && b < 21)) { console.error("npm " + process.argv[1] + " is below 11.21.0"); process.exit(1); }' "$(npm --version)"
      # First publish only. A trusted-publisher configuration cannot exist before its package, so
      # 0.9.0 stages with a one-day token stored on the npm-publish environment. Without the secret
      # the step does nothing and the publish runs over OIDC. Remove this step, and the secret, in
      # the pull request that closes the 0.9.0 publish.
      - name: Write the first-publish token to an npmrc, when set
        env:
          NPM_FIRST_PUBLISH_TOKEN: ${{ secrets.NPM_FIRST_PUBLISH_TOKEN }}
        run: |
          if [ -z "$NPM_FIRST_PUBLISH_TOKEN" ]; then
            echo "No first-publish token on the environment; publishing over OIDC."
            exit 0
          fi
          umask 077
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_FIRST_PUBLISH_TOKEN" > "$RUNNER_TEMP/first-publish.npmrc"
          echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/first-publish.npmrc" >> "$GITHUB_ENV"
          echo "The first-publish token is set; staging with it, with provenance from OIDC."
      - name: Stage the four packages under beta
        env:
          DIST_TAG: beta
        run: |
          cd "$RUNNER_TEMP/tarballs"
          echo "## Staged under \`$DIST_TAG\`" >> "$GITHUB_STEP_SUMMARY"
          while read -r _ file; do
            npm stage publish "./$file" --tag "$DIST_TAG" --access public --provenance
            echo "- \`$file\`" >> "$GITHUB_STEP_SUMMARY"
          done < "$RUNNER_TEMP/SHA256SUMS"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "Approve the four stages on npmjs.com; until then nothing is installable. Then run promote.yml with target verify (docs/contributor/releasing.md, Verify and promote)." >> "$GITHUB_STEP_SUMMARY"

  publish-dry-run:
    name: Stage to npm (dry run)
    needs: [verify-tag, gate-ci-report, pack]
    if: github.event_name == 'workflow_dispatch' && needs.verify-tag.outputs.dry-run == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read # checks out the tarball check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-tag.outputs.commit }}
          persist-credentials: false
          sparse-checkout: |
            scripts/check-tarballs.ts
            scripts/registry.ts
            scripts/temporary-install.ts
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tarballs
          path: ${{ runner.temp }}/tarballs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check the tarballs against the pack job's sums, version and commit
        env:
          SUMS: ${{ needs.pack.outputs.sums }}
          VERSION: ${{ needs.verify-tag.outputs.version }}
          COMMIT: ${{ needs.verify-tag.outputs.commit }}
        run: |
          printf '%s' "$SUMS" | base64 -d > "$RUNNER_TEMP/SHA256SUMS"
          node scripts/check-tarballs.ts --dir "$RUNNER_TEMP/tarballs" --sums "$RUNNER_TEMP/SHA256SUMS" \
            --version "$VERSION" --commit "$COMMIT"
      # The same pinned npm as the publish job; see the comment there.
      - name: Install the pinned npm
        run: | # zizmor: ignore[adhoc-packages] npm itself, pinned to an exact version
          npm install --global --ignore-scripts npm@12.2.0
          npm --version
          node -e 'const [a, b] = process.argv[1].split(".").map(Number); if (a < 11 || (a === 11 && b < 21)) { console.error("npm " + process.argv[1] + " is below 11.21.0"); process.exit(1); }' "$(npm --version)"
      - name: npm stage publish --dry-run, and the commands a release would run
        env:
          DIST_TAG: beta
          TAG: ${{ needs.verify-tag.outputs.tag }}
        run: |
          cd "$RUNNER_TEMP/tarballs"
          {
            echo "## Dry run"
            echo
            echo "In a release run, after a maintainer approves the npm-publish environment, the workflow runs:"
            echo
            echo '```sh'
            while read -r _ file; do
              echo "npm stage publish ./$file --tag $DIST_TAG --access public --provenance"
            done < "$RUNNER_TEMP/SHA256SUMS"
            echo "gh release create $TAG --verify-tag --draft --prerelease --title $TAG --notes-file notes.md"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          while read -r _ file; do
            npm stage publish --dry-run "./$file" --tag "$DIST_TAG" --access public
          done < "$RUNNER_TEMP/SHA256SUMS"

  github-release:
    name: Draft GitHub Release
    needs: [verify-tag, publish]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write # creates the draft release
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes
      # A re-run of this job after a failure finds the release and creates no second one.
      - name: Create the draft release unless it exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify-tag.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG exists; nothing to do." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease \
            --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes/notes.md"
          echo "Created the draft prerelease $TAG." >> "$GITHUB_STEP_SUMMARY"
