# Git hooks (https://lefthook.dev). Installed by `pnpm install` (the `prepare` script).
pre-commit:
  # Sequential on purpose: lint --fix and format both rewrite staged files.
  piped: true
  jobs:
    - name: lint
      glob: "*.{ts,mts,js,mjs}"
      run: pnpm exec oxlint --fix --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: format
      glob: "*.{ts,mts,js,mjs,json,jsonc,md,yml,yaml}"
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: typecheck
      glob: "*.{ts,mts}"
      run: pnpm exec tsc -b
    # Every commit: it takes a fraction of a second, and a glob would miss files directly in src/.
    - name: type-escapes
      run: node scripts/check-type-escapes.ts

commit-msg:
  jobs:
    - name: conventional-commit
      run: node scripts/check-commit-message.ts {1}

# pre-push is NOT managed by lefthook: lefthook skips pre-push jobs when it computes no
# "push files", which silently disabled the main-branch guard. scripts/install-git-hooks.ts
# installs a plain git pre-push hook instead (runs on `pnpm install`).
